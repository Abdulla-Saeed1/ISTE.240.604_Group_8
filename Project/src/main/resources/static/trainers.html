<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitReserve – Trainers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-size: 1.4rem; font-weight: 700; }
        .page-header { background: linear-gradient(135deg,#1b4332,#2d6a4f); color:#fff; padding:36px 0 28px; }
        .table thead th { background:#1b4332; color:#fff; border:none; }
        .btn-action { padding:2px 8px; font-size:.8rem; }
    </style>
</head>
<body class="bg-light">

<!-- Loading Overlay -->
<div id="loadingOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background:rgba(0,0,0,.45);z-index:9999">
    <div class="spinner-border text-light" style="width:3rem;height:3rem"></div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1100">
    <div id="mainToast" class="toast align-items-center border-0 text-white" role="alert">
        <div class="d-flex">
            <div class="toast-body fw-semibold" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-lightning-charge-fill text-warning me-2"></i>FitReserve</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/users.html"><i class="bi bi-people me-1"></i>Users</a></li>
                <li class="nav-item"><a class="nav-link active" href="/trainers.html"><i class="bi bi-person-badge me-1"></i>Trainers</a></li>
                <li class="nav-item"><a class="nav-link" href="/sessions.html"><i class="bi bi-calendar-event me-1"></i>Sessions</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings.html"><i class="bi bi-bookmark-check me-1"></i>Bookings</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Page Header -->
<div class="page-header">
    <div class="container">
        <h2 class="fw-bold mb-1"><i class="bi bi-person-badge-fill me-2"></i>Trainers</h2>
        <p class="mb-0 opacity-75 small">Managed by Khalifa Alhammadi (399001487)</p>
    </div>
</div>

<div class="container py-4">
    <div class="row g-4">

        <!-- Add Form -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-success text-white fw-semibold">
                    <i class="bi bi-person-plus-fill me-2"></i>Add New Trainer
                </div>
                <div class="card-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Trainer ID</label>
                            <input type="number" class="form-control" id="trainerId" placeholder="e.g. 203" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Full name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Specialization</label>
                            <input type="text" class="form-control" id="specialization" placeholder="e.g. Yoga" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Experience (Years)</label>
                            <input type="number" class="form-control" id="experienceYears" placeholder="e.g. 5" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Availability</label>
                            <input type="text" class="form-control" id="availabilitySchedule" placeholder="e.g. Monday-Friday" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Rating (0–5)</label>
                            <input type="number" class="form-control" id="rating" step="0.1" min="0" max="5" placeholder="e.g. 4.5" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-semibold" id="addBtn">
                            <i class="bi bi-plus-circle me-1"></i>Add Trainer
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white d-flex justify-content-between align-items-center gap-2 flex-wrap">
                    <span class="fw-semibold"><i class="bi bi-table me-2"></i>All Trainers</span>
                    <div class="d-flex align-items-center gap-2">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="searchInput" placeholder="Search..." oninput="filterTable(this.value)">
                        </div>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadData()">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th>ID</th><th>Name</th><th>Specialization</th><th>Exp.</th><th>Availability</th><th>Rating</th><th>Actions</th>
                            </tr>
                            </thead>
                            <tbody id="tableBody">
                            <tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm text-success me-2"></div>Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Trainer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3"><label class="form-label fw-semibold">Name</label>
                    <input type="text" class="form-control" id="editName" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Specialization</label>
                    <input type="text" class="form-control" id="editSpec" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Experience (Years)</label>
                    <input type="number" class="form-control" id="editExp" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Availability</label>
                    <input type="text" class="form-control" id="editAvail" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Rating</label>
                    <input type="number" class="form-control" id="editRating" step="0.1" min="0" max="5" required></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-warning fw-semibold" id="saveEditBtn">
                    <i class="bi bi-check-circle me-1"></i>Save Changes
                </button>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-secondary text-center py-3 small mt-4">
    &copy; 2026 FitReserve &mdash; ISTE.240.604 Group 8
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="trainers.js"></script>
</body>
</html>
