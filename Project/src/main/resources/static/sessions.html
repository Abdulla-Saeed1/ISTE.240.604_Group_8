<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitReserve – Sessions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

        .navbar-brand { font-size: 1.4rem; font-weight: 700; }
        .page-header { background: linear-gradient(135deg,#5c4a00,#a67c00); color:#fff; padding:36px 0 28px; }
        .table thead th { background:#7a6000; color:#fff; border:none; }
        .btn-action { padding:2px 8px; font-size:.8rem; }
    </style>
</head>
<body class="bg-light">

<div id="loadingOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background:rgba(0,0,0,.45);z-index:9999">
    <div class="spinner-border text-light" style="width:3rem;height:3rem"></div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1100">
    <div id="mainToast" class="toast align-items-center border-0 text-white" role="alert">
        <div class="d-flex">
            <div class="toast-body fw-semibold" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-lightning-charge-fill text-warning me-2"></i>FitReserve</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/users.html"><i class="bi bi-people me-1"></i>Users</a></li>
                <li class="nav-item"><a class="nav-link" href="/trainers.html"><i class="bi bi-person-badge me-1"></i>Trainers</a></li>
                <li class="nav-item"><a class="nav-link active" href="/sessions.html"><i class="bi bi-calendar-event me-1"></i>Sessions</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings.html"><i class="bi bi-bookmark-check me-1"></i>Bookings</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <h2 class="fw-bold mb-1"><i class="bi bi-calendar-event-fill me-2"></i>Fitness Sessions</h2>
        <p class="mb-0 opacity-75 small">Managed by Ujjwal Jain (746007518)</p>
    </div>
</div>

<div class="container py-4">
    <div class="row g-4">

        <!-- Add Form -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header text-white fw-semibold" style="background:#7a6000">
                    <i class="bi bi-calendar-plus me-2"></i>Add New Session
                </div>
                <div class="card-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Session ID</label>
                            <input type="number" class="form-control" id="sessionId" placeholder="e.g. 303" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Session Name</label>
                            <input type="text" class="form-control" id="sessionName" placeholder="e.g. Pilates" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Trainer ID</label>
                            <input type="number" class="form-control" id="trainerId" placeholder="e.g. 201" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Date</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Time</label>
                            <input type="text" class="form-control" id="time" placeholder="e.g. 07:00 AM" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Duration (min)</label>
                            <input type="number" class="form-control" id="duration" placeholder="e.g. 60" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Capacity</label>
                            <input type="number" class="form-control" id="capacity" placeholder="e.g. 20" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Location</label>
                            <input type="text" class="form-control" id="location" placeholder="e.g. Studio B" required>
                        </div>
                        <button type="submit" class="btn w-100 fw-semibold text-white" style="background:#7a6000" id="addBtn">
                            <i class="bi bi-plus-circle me-1"></i>Add Session
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white d-flex justify-content-between align-items-center gap-2 flex-wrap">
                    <span class="fw-semibold"><i class="bi bi-table me-2"></i>All Sessions</span>
                    <div class="d-flex align-items-center gap-2">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="searchInput" placeholder="Search..." oninput="filterTable(this.value)">
                        </div>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadData()">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th>ID</th><th>Name</th><th>Trainer</th><th>Date</th><th>Time</th><th>Duration</th><th>Capacity</th><th>Location</th><th>Actions</th>
                            </tr>
                            </thead>
                            <tbody id="tableBody">
                            <tr><td colspan="9" class="text-center py-4"><div class="spinner-border spinner-border-sm text-warning me-2"></div>Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Session</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label fw-semibold">Session Name</label>
                        <input type="text" class="form-control" id="editName" required></div>
                    <div class="col-md-6"><label class="form-label fw-semibold">Trainer ID</label>
                        <input type="number" class="form-control" id="editTrainer" required></div>
                    <div class="col-md-6"><label class="form-label fw-semibold">Date</label>
                        <input type="date" class="form-control" id="editDate" required></div>
                    <div class="col-md-6"><label class="form-label fw-semibold">Time</label>
                        <input type="text" class="form-control" id="editTime" required></div>
                    <div class="col-md-4"><label class="form-label fw-semibold">Duration (min)</label>
                        <input type="number" class="form-control" id="editDuration" required></div>
                    <div class="col-md-4"><label class="form-label fw-semibold">Capacity</label>
                        <input type="number" class="form-control" id="editCapacity" required></div>
                    <div class="col-md-4"><label class="form-label fw-semibold">Location</label>
                        <input type="text" class="form-control" id="editLocation" required></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-warning fw-semibold" id="saveEditBtn">
                    <i class="bi bi-check-circle me-1"></i>Save Changes
                </button>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-secondary text-center py-3 small mt-4">
    &copy; 2026 FitReserve &mdash; ISTE.240.604 Group 8
</footer>

</body>
</html>
